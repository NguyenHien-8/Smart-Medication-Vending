name: Build SmartMediVend ESP32-S3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build smartmedivend-s3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Test build tooling
        shell: bash
        run: |
          python -m unittest discover -s scripts/tests -v

      - name: Build SmartMediVend firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py smartmedivend-s3 \
            --name smartmedivend-s3 \
            --language vi-VN \
            --wake-word disabled

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: SmartMediVend-ESP32S3-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
